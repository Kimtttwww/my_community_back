server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: MyCommunity
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/my_community
    username: commu
    password: commu
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
      
mybatis:
  mapper-locations: classpath*:/mappers/**/*.xml
  type-aliases-package: com.my_community
  configuration:
    jdbc-type-for-null: null
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org:
      apache:
        ibatis: DEBUG

jwt:
  secret: it_s_my_secret_key_for_using_jwt
